    <div class="sky"></div>
    <div class="moon"></div>

      <rect x="292" y="58" width="22" height="242" fill="#8c1410"/>
      <rect x="190" y="62" width="20" height="26" fill="#6a0e0c"/>
    </svg>
    <div class="mist m1"></div><div class="mist m2"></div>
    <canvas id="embers"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- Toasts Container -->
  <div id="toasts" aria-live="polite" role="status"></div>
